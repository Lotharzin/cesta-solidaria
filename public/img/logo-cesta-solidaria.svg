<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C97B3D"/>
      <stop offset="100%" stop-color="#A85C2A"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E85D4C"/>
      <stop offset="100%" stop-color="#D8442F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="#FBF5EA"/>

  <!-- Icon group -->
  <g transform="translate(320,150)">
    <!-- Basket handle -->
    <path d="M -55 -25 Q 0 -100 55 -25" fill="none" stroke="url(#basketGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Basket body -->
    <path d="M -85 -20 L 85 -20 L 65 75 Q 0 95 -65 75 Z" fill="url(#basketGrad)"/>

    <!-- Weave lines -->
    <g stroke="#8C4A22" stroke-width="3" opacity="0.5">
      <line x1="-70" y1="-5" x2="-52" y2="80"/>
      <line x1="-35" y1="-10" x2="-22" y2="88"/>
      <line x1="0" y1="-12" x2="0" y2="92"/>
      <line x1="35" y1="-10" x2="22" y2="88"/>
      <line x1="70" y1="-5" x2="52" y2="80"/>
    </g>
    <g stroke="#8C4A22" stroke-width="3" opacity="0.5">
      <line x1="-82" y1="5" x2="82" y2="5"/>
      <line x1="-77" y1="30" x2="77" y2="30"/>
      <line x1="-70" y1="55" x2="70" y2="55"/>
    </g>

    <!-- Basket rim -->
    <ellipse cx="0" cy="-20" rx="85" ry="14" fill="#D98A47"/>
    <ellipse cx="0" cy="-24" rx="85" ry="14" fill="#C97B3D"/>

    <!-- Wheat / leaf accents -->
    <g transform="translate(-45,-55) rotate(-20)">
      <ellipse cx="0" cy="0" rx="6" ry="16" fill="#7BAE5A"/>
    </g>
    <g transform="translate(-25,-65) rotate(-5)">
      <ellipse cx="0" cy="0" rx="6" ry="18" fill="#8FC26A"/>
    </g>
    <g transform="translate(0,-68)">
      <ellipse cx="0" cy="0" rx="6" ry="18" fill="#7BAE5A"/>
    </g>
    <g transform="translate(25,-65) rotate(5)">
      <ellipse cx="0" cy="0" rx="6" ry="18" fill="#8FC26A"/>
    </g>
    <g transform="translate(45,-55) rotate(20)">
      <ellipse cx="0" cy="0" rx="6" ry="16" fill="#7BAE5A"/>
    </g>

    <!-- Heart resting in basket -->
    <path d="M 0 55 C -22 30 -55 32 -55 5 C -55 -12 -38 -22 -22 -12 C -12 -6 0 5 0 5 C 0 5 12 -6 22 -12 C 38 -22 55 -12 55 5 C 55 32 22 30 0 55 Z"
          fill="url(#heartGrad)" transform="translate(0,-2) scale(0.62)"/>
  </g>

  <!-- Wordmark -->
  <text x="320" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#4A3324" text-anchor="middle">Cesta Solidária</text>

  <!-- Tagline -->
  <text x="320" y="335" font-family="Verdana, Arial, sans-serif" font-size="17" letter-spacing="3" fill="#A85C2A" text-anchor="middle">UNIDOS CONTRA A FOME</text>
</svg>
